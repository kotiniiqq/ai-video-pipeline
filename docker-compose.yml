# Local stack: Postgres (n8n's own DB + the pipeline DB), n8n, and the media worker.
# Passwords default to local-only values; set them in .env for anything reachable from outside.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-local}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:-n8n-local}
      PIPELINE_DB_PASSWORD: ${PIPELINE_DB_PASSWORD:-pipeline-local}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/migrations:/migrations:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pipeline"]
      interval: 5s
      timeout: 5s
      retries: 20

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.40.6
    depends_on:
      postgres: { condition: service_healthy }
      worker: { condition: service_started }
    ports: ["127.0.0.1:5678:5678"]
    volumes:
      - n8n_data:/home/node/.n8n
      - shared:/data/shared
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-n8n-local}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-only-encryption-key}
      N8N_SECURE_COOKIE: "false"
      N8N_RESTRICT_FILE_ACCESS_TO: /data/shared
      N8N_RUNNERS_TASK_TIMEOUT: "300"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: UTC
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"

  worker:
    build: ./worker
    env_file:
      - path: .env
        required: false
    environment:
      SHARED_DIR: /data/shared
      MODE: ${MODE:-demo}
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - shared:/data/shared
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pg_data:
  n8n_data:
  shared:
